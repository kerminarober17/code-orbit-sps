    /* Complete Resilient Header & Navigation Fallbacks */
    .glass-header {
      position: fixed;
      top: 0;

    .nav-links {

    .nav-link {

    /* Active State for glass navigation links */

      max-width: 1200px;

      z-index: 10;

    .courses-grid-4 {

      .courses-grid-4 {

    /* Course Glass Cards Override */
    .course-card.glass-card {
      background: rgba(16, 23, 42, 0.65) !important;
      backdrop-filter: blur(16px) saturate(140%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(140%) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 22px !important;
      padding: 1.75rem !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4) !important;
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease, box-shadow 0.3s ease !important;

    .course-card.glass-card:hover {
      border-color: rgba(112, 214, 255, 0.6) !important;
      box-shadow: 0 16px 40px -10px rgba(7, 10, 20, 0.8), 0 0 20px rgba(112, 214, 255, 0.25) !important;

    /* Card thumbnail wrap */
    .course-card-thumb-wrap {
      width: 100%;

      border-radius: 14px;
      overflow: hidden;

      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(10, 14, 26, 0.45);
      position: relative;
    }

    .course-card-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .course-card.glass-card:hover .course-card-thumb-wrap img {
      transform: scale(1.05);
    }

    /* Primary gradient buttons */
    .btn-primary-cyan {
      background: linear-gradient(135deg, #70D6FF 0%, #C084FC 100%);
      color: #070A14 !important;
      font-weight: 800;
      border: 1px solid rgba(255, 255, 255, 0.5);

      display: inline-flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
    }

    .btn-primary-cyan:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(112, 214, 255, 0.45), 0 0 30px rgba(192, 132, 252, 0.35);
      border-color: rgba(255, 255, 255, 0.85);
      background: linear-gradient(135deg, #99E2FF 0%, #D8B4FE 100%);
    }

    /* Category Filter Buttons */
    .btn-category {
      background: rgba(16, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-weight: 700;
      padding: 0.6rem 1.5rem;
      border-radius: 50px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);

    }

    .btn-category:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-category.active {
      background: linear-gradient(135deg, #70D6FF 0%, #C084FC 100%);

      box-shadow: 0 4px 15px rgba(112, 214, 255, 0.3);

    /* Mascot Hero Portal */
    .mascot-container {
      position: relative;

      align-items: center;

    .mascot-ring {

      border: 1px dashed rgba(112, 214, 255, 0.2);
      border-radius: 50%;
      animation: spin 30s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .split-header-grid {
  display: flex !important;
  flex-direction: row !important;

    max-width: 200px !important;
  }

  <script>
    let activeFilter = 'all';
    let loadedCourses = [];
    let currentUser = null;

    function sanitizeCourses(list) {
      if (!Array.isArray(list)) return [];
      const legacyIds = ['course-1', 'course-2', 'course-3', 'course-4', 'intro-programming', 'course-code-quest', 'course-game-makers'];
      const legacyKeywords = ['code quest', 'game makers', 'web magic', 'visual coding'];
      return list.filter(c => {
        if (!c) return false;
        const id = String(c.id || '').toLowerCase();
        const title = String(c.title || '').toLowerCase();
        if (legacyIds.includes(id)) return false;
        if (legacyKeywords.some(kw => id.includes(kw) || title.includes(kw))) return false;
        return true;
      });
    }

    function updateFilterPillCounts() {
      const allCount = loadedCourses.length;
      const elAll = document.getElementById('count-all');
      if (elAll) elAll.textContent = `(${allCount})`;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (window.COURSES_DATA && window.COURSES_DATA.length > 0) {
        loadedCourses = sanitizeCourses(window.COURSES_DATA);
        updateFilterPillCounts();
        renderCatalog();
      }
      try {
        currentUser = await window.session.fetchUser();
      } catch (e) {}
      await fetchCourses();
      updateFilterPillCounts();
      renderCatalog();
    });

    async function fetchCourses() {
      try {
        const response = await fetch('/api/courses/list.php?_t=' + Date.now(), { cache: 'no-store' });
        const result = await response.json();
        if (result.success && result.data && result.data.length > 0) {
          const valid = sanitizeCourses(result.data);
          if (valid.length > 0) {
            loadedCourses = valid;
            updateFilterPillCounts();
            renderCatalog();
          }
        }
      } catch (err) {
        console.error('Failed to fetch courses from API:', err);
      }
    }

    function renderCatalog() {
      const grid = document.getElementById('catalog-courses-grid');
      const courses = loadedCourses.filter(c => {
        if (activeFilter === 'all') return true;
        const slug = (c.slug || '').toLowerCase();
        const title = (c.title || '').toLowerCase();
        const track = (c.track || c.academic_group_name || '').toLowerCase();
        const level = (c.level || '').toLowerCase();

        if (activeFilter === 'foundation') {
          return slug.includes('foundation') || level.includes('foundation') || title.includes('foundation') || track.includes('foundation');
        }
        if (activeFilter === 'python') {
          return slug.includes('python') || title.includes('python') || track.includes('python');
        }
        if (activeFilter === 'frontend') {
          return slug.includes('web') || slug.includes('frontend') || slug.includes('html') || title.includes('frontend') || title.includes('web');
        }
        if (activeFilter === 'js' || activeFilter === 'javascript') {
          return slug.includes('js') || slug.includes('javascript') || title.includes('javascript');
        }
        if (activeFilter === 'level1') {
          return level.includes('level 1') || title.includes('level 1') || c.level_number === 1;
        }
        if (activeFilter === 'level2') {
          return level.includes('level 2') || title.includes('level 2') || c.level_number === 2;
        }
        if (activeFilter === 'level3') {
          return level.includes('level 3') || title.includes('level 3') || c.level_number === 3;
        }
        return true;
      });

      if (courses.length === 0) {
        if (activeFilter === 'primary_3_4') {
          grid.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; color: #94a3b8; padding: 4rem 1.5rem;" class="glass-card">
              <i data-lucide="sparkles" style="width: 48px; height: 48px; color: #F59E0B; margin: 0 auto 1rem; opacity: 0.85;"></i>
              <h3 style="font-size: 1.35rem; font-weight: 800; color: #ffffff; margin-bottom: 0.5rem;">Primary 3 &amp; 4 Curriculum In Design</h3>
              <p style="font-size: 0.95rem; color: #cbd5e1; max-width: 520px; margin: 0 auto 1.5rem; line-height: 1.6;">
                Primary 3 &amp; 4 currently has no active courses while a brand-new cosmic curriculum is being designed. Check out courses in Primary 5 &amp; 6, Preparatory, and Secondary!
              </p>
              <button onclick="filterByGroup('all', document.querySelector('[data-filter=all]'))" class="btn-primary-cyan btn-pill btn-sm" style="padding: 0.6rem 1.5rem; border-radius: 50px; cursor: pointer;">
                <span>View All Active Courses</span>
              </button>
            </div>
          `;
        } else {
          grid.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; color: #94a3b8; padding: 4rem 1.5rem;" class="glass-card">
              <i data-lucide="compass" style="width: 48px; height: 48px; color: #94a3b8; margin: 0 auto 1rem; opacity: 0.5;"></i>
              <p style="font-size: 1.1rem; font-weight: 600;">No courses found in this quadrant.</p>
              <p style="font-size: 0.9rem; color: #64748b; margin-top: 0.25rem;">Select another path or check back soon!</p>
            </div>
          `;
        }
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      grid.innerHTML = courses.map(c => {
        const isEnrolled = c.is_enrolled || false;
        const chaptersCount = c.chaptersCount || c.chapters_count || 10;
        const lessonsCount = c.lessonsCount || c.lessons_count || 40;
        const levelBadge = c.level || (c.level_number ? 'Level ' + c.level_number : 'Foundation');

        let buttonHtml = '';
        if (isEnrolled) {
          buttonHtml = `
            <a href="/student/course.html?id=${c.id}" class="btn-primary-cyan btn-pill btn-sm" style="width: 100%; padding: 0.8rem 1rem; border-radius: 50px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;">
              <span>Continue Course</span>
              <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
            </a>
          `;
        } else {
          buttonHtml = `
            <button onclick="handleCourseEnrollment('${c.id}', this)" class="btn-primary-cyan btn-pill btn-sm" style="width: 100%; padding: 0.8rem 1rem; border-radius: 50px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; background: linear-gradient(135deg, #38BDF8 0%, #818CF8 100%);">
              <i data-lucide="plus-circle" style="width: 16px; height: 16px;"></i>
              <span>Enroll Now</span>
            </button>
          `;
        }

        return `
          <div class="course-card glass-card" id="catalog-card-${c.id}">
            <div class="course-card-thumb-wrap">
              <img src="${c.image_url || c.image || '/assets/courses/prog.png'}" alt="${c.title}" onerror="this.onerror=null; this.src='/assets/courses/prog.png';">
            </div>
            <div class="course-card-body" style="padding: 0; display: flex; flex-direction: column; flex-grow: 1;">
              <div class="course-card-header" style="margin-bottom: 0.5rem;">
                <h3 class="course-card-title" style="font-size: 1.35rem; font-weight: 800; color: #ffffff; letter-spacing: -0.01em;">${c.title}</h3>
              </div>
              <p style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 1.5rem; line-height: 1.5; min-height: 54px; flex-grow: 1;">
                ${c.description}
              </p>
              
              <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; background: rgba(255, 255, 255, 0.03); padding: 0.65rem 1rem; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.05);">
                <span class="badge" style="background: rgba(112, 214, 255, 0.12); color: #70D6FF; border: 1px solid rgba(112, 214, 255, 0.25); border-radius: 12px; padding: 0.35rem 0.75rem; font-size: 0.75rem; font-weight: 700;">${levelBadge}</span>
                <div style="display: flex; align-items: center; gap: 0.85rem; font-size: 0.8rem; color: #94a3b8;">
                  <span style="display: inline-flex; align-items: center; gap: 0.35rem;"><i data-lucide="book-open" style="width: 14px; height: 14px; color: #70D6FF;"></i> ${chaptersCount} Ch</span>
                  <span style="display: inline-flex; align-items: center; gap: 0.35rem;"><i data-lucide="play-circle" style="width: 14px; height: 14px; color: #C084FC;"></i> ${lessonsCount} Les</span>
                </div>
              </div>

              ${buttonHtml}
            </div>
          </div>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();
    }

    async function handleCourseEnrollment(courseId, btnElement) {
      if (!currentUser) {
        window.location.href = `/login.html?redirect=/student/course.html?id=${encodeURIComponent(courseId)}`;
        return;
      }

      btnElement.disabled = true;
      btnElement.innerHTML = `
        <span style="display: inline-flex; align-items: center; gap: 0.5rem;">
          <i data-lucide="loader-2" class="spin-icon" style="width: 16px; height: 16px; animation: spin 1s linear infinite;"></i>
          <span>Enrolling...</span>
        </span>
      `;
      if (window.lucide) window.lucide.createIcons();

      try {
        const res = await window.apiFetch('/api/courses/enroll.php', {
          method: 'POST',
          body: JSON.stringify({ course_id: courseId })
        });
        
        let data = null;
        try {
          data = await res.json();
        } catch (jsonErr) {}

        if (res.ok || (data && (data.success || data.already_enrolled)) || res.status === 409) {
          try {
            const stored = JSON.parse(localStorage.getItem('sps_orbit_enrolled_courses') || '[]');
            if (!stored.includes(courseId)) {
              stored.push(courseId);
              localStorage.setItem('sps_orbit_enrolled_courses', JSON.stringify(stored));
            }
          } catch(err) {}

          // Find course and update
          const course = loadedCourses.find(c => c.id === courseId);
          if (course) {
            course.is_enrolled = true;
          }

          btnElement.style.background = 'linear-gradient(135deg, #10B981 0%, #059669 100%)';
          btnElement.style.color = '#FFFFFF';
          btnElement.innerHTML = `
            <i data-lucide="check" style="width: 16px; height: 16px;"></i>
            <span>Enrolled! Launching...</span>
          `;
          if (window.lucide) window.lucide.createIcons();

          if (window.showToast) {
            window.showToast('Successfully enrolled! Loading My Courses...', 'success');
          }

          setTimeout(() => {
            window.location.href = `/student/courses.html`;
          }, 600);
        } else {
          const msg = (data && (data.message || data.error)) || 'Enrollment failed. Please try again.';
          alert(msg);
          btnElement.disabled = false;
          btnElement.innerHTML = `<span>Enroll</span>`;
        }
      } catch (e) {
        console.error('Enrollment error', e);
        // Guaranteed fallback redirect
        window.location.href = `/student/courses.html`;
      }
    }

    function filterByGroup(group, btn) {
      activeFilter = group;
      document.querySelectorAll('#category-filter-tabs button').forEach(b => {
        b.className = 'btn-category';
      });
      btn.className = 'btn-category active';
      renderCatalog();
    }
  </script>
</body>
</html>
