<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Courses - SPS Code Orbit</title>
  <link rel="stylesheet" href="/style.css?v=4.0">
  <link rel="stylesheet" href="/css/global.css?v=4.0">
  <link rel="stylesheet" href="/css/components.css?v=4.0">
  <link rel="stylesheet" href="/css/dashboard.css?v=4.0">
  <link rel="stylesheet" href="../css/responsive.css?v=1.2">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .courses-tab-bar {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 1.15rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .courses-tab-btn {
      background: rgba(16, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      font-weight: 700;
      padding: 0.55rem 1.15rem;
      border-radius: 50px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .courses-tab-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }
    .courses-tab-btn.active {
      background: linear-gradient(135deg, #38BDF8 0%, #818CF8 100%);
      color: #070A14 !important;
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 18px rgba(56, 189, 248, 0.35);
      font-weight: 800;
    }
    .courses-tab-btn .tab-count {
      background: rgba(0, 0, 0, 0.25);
      padding: 0.15rem 0.45rem;
      border-radius: 20px;
      font-size: 0.75rem;
    }
    .courses-tab-btn.active .tab-count {
      background: rgba(7, 10, 20, 0.25);
      color: #070A14;
    }

    .courses-grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 1.75rem;
    }
    @media (max-width: 768px) {
      .courses-grid-4 {
        grid-template-columns: 1fr;
        gap: 1.25rem;
      }
    }

    .course-card.student-card {
      background: rgba(16, 23, 42, 0.75) !important;
      backdrop-filter: blur(16px) saturate(140%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(140%) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 20px !important;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, border-color 0.3s ease !important;
      position: relative;
    }
    .course-card.student-card:hover {
      transform: translateY(-6px) !important;
      box-shadow: 0 20px 45px -10px rgba(7, 10, 20, 0.9), 0 0 26px rgba(56, 189, 248, 0.25) !important;
      border-color: rgba(56, 189, 248, 0.55) !important;
    }
    .course-card-thumb-wrap {
      width: 100%;
      height: 175px;
      position: relative;
      overflow: hidden;
      background: #070A14;
      display: block;
      cursor: pointer;
    }
    .course-card-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.45s ease;
    }
    .course-card.student-card:hover .course-card-thumb-wrap img {
      transform: scale(1.07);
    }
    .course-thumb-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(16, 23, 42, 0.9) 0%, transparent 60%);
      pointer-events: none;
    }
    .course-tier-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      backdrop-filter: blur(10px);
      border-radius: 8px;
      padding: 0.32rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      z-index: 2;
    }
    .course-tier-badge.tier-p34 {
      background: rgba(245, 158, 11, 0.22);
      color: #FBBF24;
      border: 1px solid rgba(245, 158, 11, 0.45);
    }
    .course-tier-badge.tier-p56 {
      background: rgba(16, 185, 129, 0.22);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.45);
    }
    .course-tier-badge.tier-prep {
      background: rgba(56, 189, 248, 0.22);
      color: #38BDF8;
      border: 1px solid rgba(56, 189, 248, 0.45);
    }
    .course-tier-badge.tier-sec {
      background: rgba(168, 85, 247, 0.22);
      color: #C084FC;
      border: 1px solid rgba(168, 85, 247, 0.45);
    }

    .course-enrolled-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(16, 185, 129, 0.9);
      backdrop-filter: blur(8px);
      color: #ffffff;
      border-radius: 8px;
      padding: 0.32rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      z-index: 2;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.3);
    }
    .course-card-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.35;
      margin-bottom: 0.5rem;
      transition: color 0.2s ease;
    }
    .course-card-title a {
      color: inherit;
      text-decoration: none;
    }
    .course-card.student-card:hover .course-card-title a {
      color: #38BDF8;
    }
    .course-card-desc {
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 1.25rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.6rem;
    }
    .course-meta-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 1.25rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 0.55rem 0.95rem;
      border-radius: 12px;
    }
    .course-action-btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border-radius: 50px;
      padding: 0.75rem 1.25rem;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.9rem;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .course-action-btn.primary {
      background: linear-gradient(135deg, #38BDF8 0%, #818CF8 100%);
      color: #070A14 !important;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }
    .course-action-btn.primary:hover {
      box-shadow: 0 6px 22px rgba(56, 189, 248, 0.5);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- ========================================================================
       0. IMMERSIVE DEEP-SPACE UNIVERSE & SWIRLING NEBULAE BACKDROP
       ======================================================================== -->
  <div class="space-universe-backdrop" aria-hidden="true">
    <div class="starfield-layer"></div>
    <div class="starfield-layer-dense"></div>
    <div class="nebula-swirl-container">
      <div class="nebula-cloud nebula-blue"></div>
      <div class="nebula-cloud nebula-purple"></div>
      <div class="nebula-cloud nebula-pink"></div>
      <div class="nebula-cloud nebula-cyan-lower"></div>
    </div>
  </div>

  <div class="app-shell" style="position: relative; z-index: 10;">
    <aside id="app-sidebar"></aside>

    <div class="main-wrapper">
      <!-- Top Header Bar with Search & Filters -->
      <header class="top-header" id="courses-top-header">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="mobile-nav-toggle" onclick="document.getElementById('app-sidebar').classList.toggle('open')" id="mobile-menu-btn">
            <i data-lucide="menu"></i>
          </button>
          <div class="header-greeting">
            <h1 style="color: #ffffff !important;">My Enrolled Courses</h1>
            <p style="color: #94a3b8;">Your active learning journeys, track milestones, and chapter progress.</p>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 1rem;">
          <!-- Catalog Link Button -->
          <a href="/courses.html" class="btn-primary-cyan btn-pill btn-sm" style="padding: 0.6rem 1.1rem; border-radius: 50px; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; font-weight: 700;">
            <i data-lucide="compass" style="width: 16px; height: 16px;"></i>
            <span>Browse Full Catalog</span>
          </a>

          <!-- Search input -->
          <div class="search-input-wrap" style="width: 240px;">
            <input type="text" class="search-input" placeholder="Search my courses..." id="courses-search-input" onkeyup="handleFilterChange()">
            <i data-lucide="search" style="width: 18px; height: 18px;"></i>
          </div>

          <!-- Notification Bell -->
          <div class="notification-bell" onclick="showToast('You have 3 unread course announcements', 'info')" id="header-notif-bell">
            <i data-lucide="bell" style="width: 20px; height: 20px;"></i>
            <span class="notification-badge">3</span>
          </div>

          <!-- Profile -->
          <a href="/student/profile.html">
            <img src="https://ui-avatars.com/api/?name=Student&background=E0E7FF&color=4338CA" alt="Profile" class="header-user-avatar">
          </a>
        </div>
      </header>

      <!-- Page Content -->
      <main class="page-content">
        <!-- 1. Learning Path Hero Banner -->
        <div class="learning-path-banner" id="learning-path-banner" style="background: linear-gradient(135deg, rgba(56, 189, 248, 0.08) 0%, rgba(129, 140, 248, 0.08) 100%); border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 20px; padding: 1.5rem 2rem; display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; backdrop-filter: blur(12px);">
          <div class="learning-path-left" style="display: flex; align-items: center; gap: 1.25rem;">
            <div class="learning-path-icon" style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, rgba(56, 189, 248, 0.2) 0%, rgba(129, 140, 248, 0.2) 100%); display: flex; align-items: center; justify-content: center; color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.3);">
              <i data-lucide="book-marked" style="width: 26px; height: 26px;"></i>
            </div>
            <div class="learning-path-info">
              <h3 id="academic-path-title" style="font-size: 1.25rem; font-weight: 800; color: #ffffff; margin-bottom: 0.25rem;">Enrolled Study Deck</h3>
              <p id="academic-path-desc" style="color: #94a3b8; font-size: 0.9rem;">Jump back into your active coding lessons and chapter assessments.</p>
            </div>
          </div>

          <div style="display: flex; align-items: center; gap: 1rem;">
            <div class="academic-group-pill" id="academic-group-pill-container" style="display: flex; align-items: center; gap: 0.85rem; background: rgba(7, 10, 20, 0.6); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 14px; padding: 0.75rem 1.25rem;">
              <i data-lucide="graduation-cap" style="width: 24px; height: 24px; color: #38BDF8;"></i>
              <div>
                <div class="group-label" style="font-size: 0.75rem; color: #94a3b8; font-weight: 700; text-transform: uppercase;">Academic Group</div>
                <div class="group-val" id="academic-group-val" style="font-size: 1rem; font-weight: 800; color: #ffffff;">Preparatory</div>
              </div>
            </div>
          </div>
        </div>

        <!-- 2. Course Tabs & Filters -->
        <div class="courses-tab-bar" id="courses-filter-tabs">
          <button class="courses-tab-btn active" data-view="enrolled" onclick="switchView('enrolled', this)">
            <i data-lucide="bookmark-check" style="width: 16px; height: 16px;"></i>
            <span id="enrolled-tab-label">My Enrolled Courses</span>
          </button>
          <button class="courses-tab-btn" data-view="foundation" onclick="switchView('foundation', this)">Foundation Track</button>
          <button class="courses-tab-btn" data-view="python" onclick="switchView('python', this)">Python Track</button>
          <a href="/courses.html" class="courses-tab-btn" style="text-decoration: none; color: #38BDF8; margin-left: auto; border: 1px dashed rgba(56, 189, 248, 0.4);">
            <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
            <span>+ Explore Catalog</span>
          </a>
        </div>

        <!-- 3. Course Cards Grid -->
        <div class="courses-grid-4" style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.75rem;" id="my-courses-grid">
          <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 3rem 0;">
            Loading enrolled courses...
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/session.js?v=5.0"></script>
  <script src="/data/programming_foundations_curriculum.js?v=5.0"></script>
  <script src="/data/python_foundations_curriculum.js?v=5.0"></script>
  <script src="/data/python_level2_curriculum.js?v=5.0"></script>
  <script src="/data/python_level2_exams.js?v=5.0"></script>
  <script src="/data/curriculum_index.js?v=5.0"></script>
  <script src="/data/courses.js?v=5.0"></script>
  <script src="/js/theme.js?v=4.0"></script>
  <script src="/js/components.js?v=4.0"></script>
  <script>
    let allCoursesList = [];
    let enrolledCourseIds = new Set();
    let currentView = 'enrolled';

    function getLocalEnrollments() {
      try {
        const stored = JSON.parse(localStorage.getItem('sps_orbit_enrolled_courses') || '[]');
        return Array.isArray(stored) ? stored : [];
      } catch(e) {
        return [];
      }
    }

    function saveLocalEnrollments(set) {
      try {
        localStorage.setItem('sps_orbit_enrolled_courses', JSON.stringify(Array.from(set)));
      } catch(e) {}
    }

    function sanitizeCourses(list) {
      if (!Array.isArray(list)) return [];
      const legacyIds = ['course-1', 'course-2', 'course-3', 'course-4', 'intro-programming', 'course-code-quest', 'course-game-makers'];
      const legacyKeywords = ['code quest', 'game makers', 'web magic', 'visual coding'];
      return list.filter(c => {
        if (!c) return false;
        const id = String(c.id || '').toLowerCase();
        const title = String(c.title || '').toLowerCase();
        if (legacyIds.includes(id)) return false;
        if (legacyKeywords.some(kw => id.includes(kw) || title.includes(kw))) return false;
        return true;
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      enrolledCourseIds.clear();

      const user = await window.session.requireAuth(['student']);
      window.renderSidebar('my-courses');
      
      if (user) {
        const grade = user.grade_name || user.grade || 'Prep 3';
        const className = user.class_name || user.class || 'Class Prep 3 - C';
        const academicGroup = user.academic_group_name || user.academic_group || 'Preparatory';

        const descEl = document.getElementById('academic-path-desc');
        if (descEl) {
          descEl.textContent = `Assigned academic track for ${grade} · ${className}.`;
        }

        const groupEl = document.getElementById('academic-group-val');
        if (groupEl) {
          groupEl.textContent = academicGroup;
        }
      }

      await loadStudentCourses();
    });

    async function loadStudentCourses() {
      // 1. Initial Local Data Setup
      if (window.CURRICULUM_INDEX && typeof window.CURRICULUM_INDEX.getAllCourses === 'function') {
        const raw = window.CURRICULUM_INDEX.getAllCourses();
        if (raw && raw.length > 0) {
          allCoursesList = sanitizeCourses(raw);
        }
      } else if (window.COURSES_DATA && Array.isArray(window.COURSES_DATA)) {
        allCoursesList = sanitizeCourses(window.COURSES_DATA);
      }

      // 2. Fetch from backend API
      try {
        const [dashRes, listRes] = await Promise.all([
          window.apiFetch('/api/student/dashboard.php?_t=' + Date.now(), { cache: 'no-store' }),
          window.apiFetch('/api/courses/list.php?_t=' + Date.now(), { cache: 'no-store' })
        ]);

        let progressMap = {};
        if (dashRes && dashRes.ok) {
          const dashJson = await dashRes.json();
          if (dashJson.success && dashJson.data) {
            const { courses, user_progress, completed_lesson_ids } = dashJson.data;
            if (Array.isArray(courses)) {
              courses.forEach(c => {
                enrolledCourseIds.add(c.id);
                progressMap[c.id] = c.progress || 0;
              });
            }
            if (user_progress && typeof user_progress === 'object') {
              Object.keys(user_progress).forEach(cid => {
                enrolledCourseIds.add(cid);
                if (user_progress[cid] && user_progress[cid].percentage !== undefined) {
                  progressMap[cid] = user_progress[cid].percentage;
                }
              });
            }
            if (window.CURRICULUM_INDEX && typeof window.CURRICULUM_INDEX.syncCompletedLessonsToStorage === 'function') {
              window.CURRICULUM_INDEX.syncCompletedLessonsToStorage(completed_lesson_ids || []);
            }
            if (dashJson.data.stats && dashJson.data.stats.total_xp !== undefined) {
              if (window.CURRICULUM_INDEX && typeof window.CURRICULUM_INDEX.syncUserXpToStorage === 'function') {
                window.CURRICULUM_INDEX.syncUserXpToStorage(dashJson.data.stats.total_xp);
              }
            }
          }
        }

        if (listRes && listRes.ok) {
          const listJson = await listRes.json();
          if (listJson.success && Array.isArray(listJson.data) && listJson.data.length > 0) {
            allCoursesList = sanitizeCourses(listJson.data);
            allCoursesList.forEach(c => {
              if (c.is_enrolled) enrolledCourseIds.add(c.id);
              if (progressMap[c.id] !== undefined) {
                c.progress = progressMap[c.id];
              }
            });
          }
        }

        // Apply progress map to allCoursesList
        allCoursesList.forEach(c => {
          if (progressMap[c.id] !== undefined) {
            c.progress = progressMap[c.id];
          }
        });

        saveLocalEnrollments(enrolledCourseIds);
        renderCourseCards();
      } catch (e) {
        console.error('Failed to load courses', e);
        renderCourseCards();
      }
    }

    function switchView(view, btn) {
      currentView = view;
      document.querySelectorAll('#courses-filter-tabs button').forEach(b => {
        b.classList.remove('active');
      });
      if (btn) btn.classList.add('active');
      renderCourseCards();
    }

    function handleFilterChange() {
      renderCourseCards();
    }

    function getTierBadgeClass(group) {
      const low = String(group || '').toLowerCase();
      if (low.includes('3') || low.includes('4') || low.includes('p3') || low.includes('p4')) return 'tier-p34';
      if (low.includes('5') || low.includes('6') || low.includes('p5') || low.includes('p6')) return 'tier-p56';
      if (low.includes('prep')) return 'tier-prep';
      return 'tier-sec';
    }

    function renderCourseCards() {
      const container = document.getElementById('my-courses-grid');
      if (!container) return;

      const searchInput = document.getElementById('courses-search-input');
      const query = (searchInput ? searchInput.value : '').toLowerCase().trim();

      // Update enrolled tab badge count
      const enrolledCount = allCoursesList.filter(c => enrolledCourseIds.has(c.id) || c.is_enrolled).length;
      const tabLabel = document.getElementById('enrolled-tab-label');
      if (tabLabel) {
        tabLabel.textContent = `My Enrolled Courses (${enrolledCount})`;
      }

      const filtered = allCoursesList.filter(c => {
        const id = (c.id || '').toLowerCase();
        const slug = (c.slug || '').toLowerCase();
        const title = (c.title || '').toLowerCase();
        const tier = (c.academic_group_name || c.academicGroupLabel || c.level || '').toLowerCase();
        const isEnrolled = enrolledCourseIds.has(c.id) || c.is_enrolled;

        // View Filtering - By default only enrolled courses are shown!
        if (currentView === 'enrolled' && !isEnrolled) return false;
        if (currentView === 'foundation') {
          if (!slug.includes('foundation') && !title.includes('foundation')) return false;
        }
        if (currentView === 'python') {
          if (!slug.includes('python') && !title.includes('python')) return false;
        }
        if (currentView === 'frontend') {
          if (!slug.includes('web') && !slug.includes('front') && !title.includes('frontend') && !title.includes('web')) return false;
        }
        if (currentView === 'js' || currentView === 'javascript') {
          if (!slug.includes('js') && !slug.includes('javascript') && !title.includes('javascript')) return false;
        }

        // Search Query
        if (query) {
          return title.includes(query) || (c.description || '').toLowerCase().includes(query) || id.includes(query);
        }

        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 2rem; background: rgba(16, 23, 42, 0.5); border-radius: 20px; border: 1px dashed rgba(56, 189, 248, 0.25);">
            <div style="width: 64px; height: 64px; border-radius: 50%; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; color: #38BDF8;">
              <i data-lucide="compass" style="width: 32px; height: 32px;"></i>
            </div>
            <h3 style="font-size: 1.35rem; font-weight: 800; color: #ffffff; margin-bottom: 0.5rem;">No Enrolled Courses Found</h3>
            <p style="color: #94a3b8; max-width: 480px; margin: 0 auto 1.75rem; font-size: 0.95rem; line-height: 1.5;">
              Explore our complete 10-course cosmic curriculum catalog in programming, robotics, web development, and AI to start learning!
            </p>
            <a href="/courses.html" class="btn-primary-cyan btn-pill" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.85rem 1.75rem; border-radius: 50px; text-decoration: none; font-weight: 800;">
              <i data-lucide="compass" style="width: 18px; height: 18px;"></i>
              <span>Explore Course Catalog &amp; Enroll</span>
            </a>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      container.innerHTML = filtered.map(c => {
        const chCount = c.chaptersCount || (c.chapters ? c.chapters.length : 10);
        const lesCount = c.lessonsCount || (c.chapters ? c.chapters.reduce((acc, ch) => acc + (ch.lessons ? ch.lessons.length : 5), 0) : 50);
        const groupLabel = c.level || (c.level_number ? 'Level ' + c.level_number : 'Foundation');
        const isEnrolled = enrolledCourseIds.has(c.id) || c.is_enrolled || false;
        const progress = c.progress !== undefined ? c.progress : 0;
        const img = c.image || c.image_url || '/assets/courses/prog.png';
        const actionLabel = progress >= 100 ? 'Review Course' : (progress > 0 ? 'Continue Course' : 'Start Course');
        const tierClass = getTierBadgeClass(groupLabel);
        const courseUrl = `/student/course.html?id=${encodeURIComponent(c.id)}`;

        return `
          <div class="course-card student-card" id="student-course-${c.id}">
            <a href="${courseUrl}" class="course-card-thumb-wrap">
              <img src="${img}" alt="${c.title}" onerror="this.onerror=null; this.src='/assets/courses/prog.png';">
              <div class="course-thumb-overlay"></div>
              <span class="course-tier-badge ${tierClass}">${groupLabel}</span>
              ${isEnrolled ? '<span class="course-enrolled-badge"><i data-lucide="check" style="width: 12px; height: 12px;"></i> Enrolled</span>' : ''}
            </a>
            <div class="course-card-body" style="padding: 1.5rem; display: flex; flex-direction: column; flex: 1;">
              <h3 class="course-card-title">
                <a href="${courseUrl}">${c.title}</a>
              </h3>
              <p class="course-card-desc" title="${c.description || ''}">${c.description || 'Interactive coding journey designed for students.'}</p>
              
              <div class="course-meta-pill">
                <span style="display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 600;"><i data-lucide="book-open" style="width: 15px; height: 15px; color: #38BDF8;"></i> ${chCount} Chapters</span>
                <span style="display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 600;"><i data-lucide="play-circle" style="width: 15px; height: 15px; color: #C084FC;"></i> ${lesCount} Lessons</span>
              </div>

              <div style="margin-bottom: 1.15rem;">
                <div style="display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 700; color: #cbd5e1; margin-bottom: 0.35rem;">
                  <span>Course Progress</span>
                  <span style="color: #38BDF8;">${progress}%</span>
                </div>
                <div style="width: 100%; height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 10px; overflow: hidden;">
                  <div style="width: ${progress}%; height: 100%; background: linear-gradient(90deg, #38BDF8, #818CF8); border-radius: 10px;"></div>
                </div>
              </div>

              <div style="margin-top: auto;">
                <a href="${courseUrl}" class="course-action-btn primary">
                  <span>${actionLabel}</span>
                  <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();
    }
  </script>
</body>
</html>
